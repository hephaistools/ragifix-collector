[project]
name = "ragifix-collector"
version = "0.1.0"
description = "Mini ETL : détecte les changements sur des sources configurables et alimente ragifix via son API."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
sharepoint = ["msal>=1.28"]

[project.scripts]
ragifix-collector = "ragifix_collector.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragifix_collector"]

[tool.hatch.build.targets.sdist]
include = ["src/ragifix_collector", "pyproject.toml", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "heavy: tests nécessitant msal installé (extra 'sharepoint') ou un accès réseau",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
