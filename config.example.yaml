# =============================================================================
# Configuration de ragifix-collector
# Indépendante de celle de ragifix. Aucun secret en clair ici : uniquement
# des références à des variables d'environnement.
# =============================================================================

ragifix:
  base_url: "http://127.0.0.1:8421"
  api_token_env: RAGIFIX_API_TOKEN   # même valeur que api.auth_token_env côté ragifix
  timeout_seconds: 60

sync:
  # Intervalle en secondes entre deux cycles. 0 = mode one-shot (un seul
  # cycle puis arrêt, pour être piloté par cron / systemd timer plutôt que
  # par la boucle interne).
  interval_seconds: 300
  # Nombre maximal de tentatives avant qu'un document échoué ne soit abandonné.
  max_retries: 5

sources:

  # --- Connecteur fichiers locaux (natif) ------------------------------
  - name: docs_internes
    type: local_fs
    enabled: true
    description: "Documents internes de référence (procédures, analyses)"
    paths:
      - /srv/ragifix-data/docs
      - /srv/ragifix-data/procedures
    extensions:
      method: allow                # allow = liste blanche | deny = liste noire
      list: [txt, md, html, pdf, docx, pptx, xlsx]

  # --- Connecteur SharePoint (nécessite: pip install ragifix-collector[sharepoint]) --
  - name: sharepoint_projet_x
    type: sharepoint
    enabled: true
    tenant_id: "11111111-2222-3333-4444-555555555555"
    client_id: "66666666-7777-8888-9999-000000000000"
    client_secret_env: SHAREPOINT_PROJET_X_CLIENT_SECRET
    site_url: "https://contoso.sharepoint.com/sites/ProjetX"
    folder_path: "/Documents partagés/Projet-X/RAG"
    extensions:
      method: deny
      list: [zip, exe, tmp]

  # --- Connecteur CSV d'événements (events_propres.csv) --------------------
  # Un événement du CSV devient un fragment Markdown + métadonnées structurées
  # envoyés à ragifix (voir datas/etude_decoupage.md). One-shot : à piloter
  # par cron / systemd timer (interval_seconds: 0).
  # - name: events_marseille
  #   type: csv_events
  #   enabled: true
  #   description: "Événements de Marseille (events_propres.csv)"
  #   path: /srv/ragifix-data/events_propres.csv

  # Ajouter d'autres sources ici en suivant le même schéma (name/type
  # uniques). Un connecteur tiers installé (via entry_points) est
  # référencé de la même façon via son "type".

state_store:
  # Cursors de synchronisation par source (aucun chunk_id ici).
  backend: sqlite
  sqlite:
    path: /var/lib/ragifix-collector/state.db

logging:
  level: INFO
